[project]
name = "echo-bot"
version = "0.1.0"
description = "PM bot for Microsoft Teams: answers from the team's Notion and GitHub"
authors = [{ name = "Your Name", email = "you@example.com" }]
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
  "python-dotenv>=1.0.0",
  "microsoft-teams-apps",
  "notion-client>=2.3.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.406",
]

# 실행은 스크립트 대신 README의 명령으로 한다: 서버 `src/server/main.py`, 봇 `src/bot/main.py`.
# (예전 `start = "src.main:main"`은 bot/server로 나뉘기 전의 src/main.py를 가리켰다.)
[project.scripts]
typecheck = "pyright.cli:entrypoint"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
